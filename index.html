<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <!--app-head-->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ps-theme');
          var mode = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = mode;
          var size = parseInt(localStorage.getItem('ps-font') || '', 10);
          if (size >= 15 && size <= 24) document.documentElement.style.setProperty('--read-size', size + 'px');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true"><span>POJOK SUARA</span></div>
    </div>
    <noscript>Situs ini membutuhkan JavaScript untuk menampilkan tulisan.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
